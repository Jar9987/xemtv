<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kênh IPTV</title>
<style>
:root{--bg:#14171f;--panel:#1d212c;--line:#2c3242;--text:#e8e6df;--muted:#8f95a8;--accent:#f2b134}
@media (prefers-color-scheme:light){:root{--bg:#f3f1ec;--panel:#fff;--line:#d9d5cb;--text:#1c1e26;--muted:#666b7a;--accent:#b8730a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:20px;margin:0 12px 0 0}
input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font:inherit}
input{flex:1;min-width:180px}
input:focus,select:focus,button:focus-visible,.ch:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#status{color:var(--muted);font-size:14px;padding:10px 16px}
#list{list-style:none;margin:0;padding:0 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.ch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.ch:hover{border-color:var(--accent)}
.ch img{width:36px;height:36px;object-fit:contain;flex:none;border-radius:4px;background:#fff2}
.ch b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch small{color:var(--muted)}
.ch div{min-width:0}
#more{display:none;margin:0 auto 32px;background:var(--accent);color:#1a1300;border:0;border-radius:6px;padding:10px 22px;font:600 15px inherit;cursor:pointer}
/* Cửa sổ phát */
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.open{display:flex}
.box{width:min(960px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.bar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 12px;cursor:pointer;font:inherit}
video{display:block;width:100%;max-height:70vh;background:#000}
#err{color:#ff8a7a;padding:10px 14px;display:none;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Kênh IPTV</h1>
  <input id="q" type="search" placeholder="Tìm tên kênh…" aria-label="Tìm kênh">
  <select id="g" aria-label="Lọc theo nhóm"><option value="">Tất cả nhóm</option></select>
</header>
<div id="status">Đang tải danh sách kênh…</div>
<ul id="list"></ul>
<button id="more">Xem thêm</button>

<div id="modal" role="dialog" aria-modal="true" aria-label="Trình phát">
  <div class="box">
    <div class="bar"><strong id="title"></strong><button id="close">Đóng</button></div>
    <video id="video" controls autoplay playsinline></video>
    <div id="err">Không phát được luồng này (luồng có thể đã ngừng hoặc bị chặn). Hãy thử kênh khác.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const M3U = "https://iptv-org.github.io/iptv/index.m3u";
const PAGE = 200;
const $ = id => document.getElementById(id);
let channels = [], filtered = [], shown = 0, hls = null;

function parse(text){
  const out = [], lines = text.split(/\r?\n/);
  let cur = null;
  for(const raw of lines){
    const l = raw.trim();
    if(l.startsWith("#EXTINF")){
      const attr = k => (l.match(new RegExp(k + '="([^"]*)"')) || [])[1] || "";
      cur = { name: l.slice(l.lastIndexOf(",") + 1).trim(), logo: attr("tvg-logo"), group: attr("group-title") };
    } else if(l && !l.startsWith("#") && cur){
      cur.url = l; out.push(cur); cur = null;
    }
  }
  return out;
}

function render(reset){
  const list = $("list");
  if(reset){ list.innerHTML = ""; shown = 0; }
  const frag = document.createDocumentFragment();
  filtered.slice(shown, shown + PAGE).forEach(ch => {
    const li = document.createElement("li");
    li.className = "ch"; li.tabIndex = 0;
    li.innerHTML = '<img alt="" loading="lazy"><div><b></b><small></small></div>';
    const img = li.querySelector("img");
    if(ch.logo) img.src = ch.logo; else img.style.visibility = "hidden";
    img.onerror = () => img.style.visibility = "hidden";
    li.querySelector("b").textContent = ch.name;
    li.querySelector("small").textContent = ch.group || "Khác";
    const open = () => play(ch);
    li.onclick = open;
    li.onkeydown = e => { if(e.key === "Enter") open(); };
    frag.appendChild(li);
  });
  list.appendChild(frag);
  shown = Math.min(shown + PAGE, filtered.length);
  $("more").style.display = shown < filtered.length ? "block" : "none";
  $("status").textContent = filtered.length + " kênh";
}

function filter(){
  const q = $("q").value.trim().toLowerCase(), g = $("g").value;
  filtered = channels.filter(c => (!g || c.group.split(";").includes(g)) && (!q || c.name.toLowerCase().includes(q)));
  render(true);
}

function play(ch){
  $("title").textContent = ch.name;
  $("err").style.display = "none";
  $("modal").classList.add("open");
  const v = $("video");
  stop();
  if(window.Hls && Hls.isSupported()){
    hls = new Hls();
    hls.on(Hls.Events.ERROR, (_, d) => { if(d.fatal) $("err").style.display = "block"; });
    hls.loadSource(ch.url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{}));
  } else if(v.canPlayType("application/vnd.apple.mpegurl")){
    v.src = ch.url;
    v.onerror = () => $("err").style.display = "block";
    v.play().catch(()=>{});
  } else {
    $("err").style.display = "block";
  }
}

function stop(){
  const v = $("video");
  if(hls){ hls.destroy(); hls = null; }
  v.pause(); v.removeAttribute("src"); v.load();
}
function closeModal(){ stop(); $("modal").classList.remove("open"); }

$("close").onclick = closeModal;
$("modal").onclick = e => { if(e.target === $("modal")) closeModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
$("more").onclick = () => render(false);
$("q").oninput = filter;
$("g").onchange = filter;

fetch(M3U).then(r => { if(!r.ok) throw 0; return r.text(); }).then(t => {
  channels = parse(t);
  const groups = [...new Set(channels.flatMap(c => c.group.split(";")).filter(Boolean))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = o.textContent = g; $("g").appendChild(o); });
  filter();
}).catch(() => { $("status").textContent = "Không tải được danh sách kênh. Kiểm tra kết nối mạng rồi tải lại trang."; });
</script>
</body>
</html>
